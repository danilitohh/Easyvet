name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Report all dependency advisories
        run: npm audit --audit-level=high

  database-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: easyvet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d easyvet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Create Supabase roles in ephemeral database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE ROLE veterinary LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'veterinary_dev_only';
          CREATE SCHEMA extensions;
          SQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/easyvet_test

      - name: Verify the integration runtime role cannot bypass RLS
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            role_is_superuser boolean;
            role_bypasses_rls boolean;
          BEGIN
            SELECT rolsuper, rolbypassrls
              INTO role_is_superuser, role_bypasses_rls
            FROM pg_roles
            WHERE rolname = 'veterinary';

            IF role_is_superuser OR role_bypasses_rls THEN
              RAISE EXCEPTION 'The integration runtime role must not be superuser or bypass RLS';
            END IF;
          END;
          $$;
          SQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/easyvet_test

      - name: Apply migrations to ephemeral test database
        run: npx --no-install prisma migrate deploy --schema prisma/schema.prisma --config prisma.config.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/easyvet_test

      - name: Grant the runtime role only migrated application data access
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public, extensions TO veterinary;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO veterinary;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO veterinary;
          SQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/easyvet_test

      - name: Verify RLS blocks direct client roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            missing_rls integer;
          BEGIN
            SELECT count(*)
              INTO missing_rls
            FROM pg_class AS c
            JOIN pg_namespace AS n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relkind IN ('r', 'p')
              AND c.relname <> '_prisma_migrations'
              AND (NOT c.relrowsecurity OR NOT c.relforcerowsecurity);

            IF missing_rls <> 0 THEN
              RAISE EXCEPTION 'Expected forced RLS on every public application table; missing=%', missing_rls;
            END IF;
          END;
          $$;

          GRANT USAGE ON SCHEMA public TO anon, authenticated;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO anon, authenticated;

          SET ROLE anon;
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.subscription_plans) <> 0 THEN
              RAISE EXCEPTION 'anon can read public application rows despite RLS';
            END IF;
          END;
          $$;
          RESET ROLE;

          SET ROLE authenticated;
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.subscription_plans) <> 0 THEN
              RAISE EXCEPTION 'authenticated can read public application rows despite RLS';
            END IF;
          END;
          $$;
          RESET ROLE;
          SQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/easyvet_test

      - name: Run database integration tests
        run: npm run test:db
