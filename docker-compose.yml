services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veterinary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veterinary_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-veterinary_saas}
    ports:
      - '5432:5432'
    volumes:
      - veterinary_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  veterinary_postgres_data:
